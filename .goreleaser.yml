version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/main.go
    binary: kube-diff
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/somaz94/kube-diff/cmd/cli.version={{.Version}}
      - -X github.com/somaz94/kube-diff/cmd/cli.commit={{.Commit}}
      - -X github.com/somaz94/kube-diff/cmd/cli.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix'
      order: 1
    - title: "Performance"
      regexp: '^perf'
      order: 2
    - title: "Refactoring"
      regexp: '^refactor'
      order: 3
    - title: "Build"
      regexp: '^build'
      order: 4
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - '^docs: update changelog'
      - '^docs: update CONTRIBUTORS'
      - '^Merge'
      - '^Auto commit'

release:
  github:
    owner: somaz94
    name: kube-diff
  draft: false
  prerelease: auto

# Homebrew. A cask, not a formula: GoReleaser deprecated "brews" in v2.10 and
# documents removal in v2.16, while this pins no GoReleaser version.
#
# Linux keeps working — a cask whose only artifact is a binary installs there
# the same way, despite cask documentation being written for macOS.
#
# Releases before this one shipped a formula, and Homebrew treats the two as
# separate packages, so "brew upgrade" will not carry anyone across. The
# release notes have to tell them:
#   brew uninstall --formula kube-diff
#   brew install --cask somaz94/tap/kube-diff
# Installing the cask without removing the formula first leaves both in place
# and silently keeps running the old binary.
#
# The old kube-diff.rb in the tap has to be deleted and a tap_migrations.json
# entry added AFTER the first cask release, never before — while the formula
# exists it shadows the cask, and deleting it early breaks installs in the gap.
homebrew_casks:
  - name: kube-diff
    binaries:
      - kube-diff
    directory: Casks
    repository:
      owner: somaz94
      name: homebrew-tap
    homepage: "https://github.com/somaz94/kube-diff"
    description: "Compare local Kubernetes manifests against live cluster state"
    hooks:
      post:
        # Homebrew quarantines cask downloads, and this binary is not signed or
        # notarized, so macOS would refuse to run it without this.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kube-diff"]
          end
    caveats: |
      🎉 kube-diff installed!

      Quick start:
        kube-diff file <path>              # Compare YAML files vs cluster
        kube-diff helm <chart> -r <name>   # Compare Helm chart vs cluster
        kube-diff kustomize <path>         # Compare Kustomize vs cluster
        kube-diff --help                   # Full usage

      Docs: https://github.com/somaz94/kube-diff

scoops:
  - repository:
      owner: somaz94
      name: scoop-bucket
    homepage: "https://github.com/somaz94/kube-diff"
    description: "Compare local Kubernetes manifests against live cluster state"
    license: "Apache-2.0"

krews:
  - name: diff2
    repository:
      owner: somaz94
      name: krew-index
    homepage: "https://github.com/somaz94/kube-diff"
    description: "Compare local Kubernetes manifests against live cluster state"
    short_description: "Diff local K8s manifests vs cluster"
